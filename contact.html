<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact - IK Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}
.container {
    padding: 80px 20px;
}
h1 {
    font-size: 40px;
}
form {
    max-width: 400px;
    margin: auto;
}
input, textarea {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: none;
    border-radius: 5px;
}
button {
    padding: 12px 25px;
    background: #ff4c4c;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background: red;
}
a {
    color: #ff4c4c;
    text-decoration: none;
}
</style>
</head>
<body>

<div class="container">
<h1>Contact IK Studio</h1>
<p>We write scripts for Ads, Short Films & Feature Films</p>

<form action="https://formspree.io/f/mzdawwdo" method="POST">
<input type="text" name="name" placeholder="Your Name" required>
<input type="email" name="email" placeholder="Your Email" required>
<textarea name="message" rows="5" placeholder="Your Message" required></textarea>
<button type="submit">Send Message</button>
</form>

<br>
<a href="index.html">← Back to Home</a>

</div>

</body>
</html>
